name: Triage bot

# Lets ANY commenter drive a ticket the way any logged-in user can in Trac:
#   @triagebot-test accept | ready | needs-design | someday | unreview
#       -> set the Triage stage issue field
#   @triagebot-test claim
#       -> take ownership: assign yourself, REMOVING any previous assignee
#          (people abandon claims; taking over an abandoned ticket is required)
#   @triagebot-test unclaim
#       -> remove yourself as assignee
#
# No org membership needed; the comment author is recorded immutably by GitHub,
# so every change is auditable and reversible.
#
# Safety: the untrusted comment body is only read as a JavaScript variable
# inside actions/github-script. It is never interpolated into a shell run: step,
# and the workflow never checks out or executes comment-supplied code, so there
# is no command-injection surface.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const map = JSON.parse(
              fs.readFileSync('.github/issue-field-map.json', 'utf8')
            );
            const HANDLE = '@triagebot-test';
            const STAGE_VERBS = {
              'accept': 'Accepted',
              'ready': 'Ready for checkin',
              'needs-design': 'Design decision needed',
              'someday': 'Someday/Maybe',
              'unreview': 'Unreviewed',
            };

            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const actor = comment.user.login;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            // Gather the recognised command from lines starting with the handle.
            let stage = null, assign = null, sawCommand = false, unknown = null;
            for (const raw of (comment.body || '').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line.toLowerCase().startsWith(HANDLE)) continue;
              sawCommand = true;
              const verb = line.slice(HANDLE.length).trim().toLowerCase().split(/\s+/)[0];
              if (verb in STAGE_VERBS) stage = STAGE_VERBS[verb];
              else if (verb === 'claim') assign = 'claim';
              else if (verb === 'unclaim') assign = 'unclaim';
              else unknown = verb;
            }
            if (!sawCommand) return;

            const react = (content) =>
              github.rest.reactions.createForIssueComment({
                ...repo, comment_id: comment.id, content,
              });

            let acted = false;

            if (stage) {
              const field = map['Triage stage'];
              await github.graphql(
                `mutation($issue:ID!,$fields:[IssueFieldCreateOrUpdateInput!]!){
                   setIssueFieldValue(input:{issueId:$issue,issueFields:$fields}){
                     clientMutationId
                   }
                 }`,
                { issue: issue.node_id,
                  fields: [{ fieldId: field.id, singleSelectOptionId: field.options[stage] }] }
              );
              // GITHUB_TOKEN field changes don't cascade to the next-steps
              // workflow, so refresh the guidance comment directly here.
              const refresh = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/next-steps.js`);
              await refresh({ github, context });
              acted = true;
            }

            if (assign === 'claim') {
              // Takeover: replace the assignee set with just the commenter,
              // unassigning whoever held it before.
              await github.rest.issues.update({
                ...repo, issue_number: issue.number, assignees: [actor],
              });
              acted = true;
            } else if (assign === 'unclaim') {
              await github.rest.issues.removeAssignees({
                ...repo, issue_number: issue.number, assignees: [actor],
              });
              acted = true;
            }

            await react(acted ? '+1' : 'confused');
            if (!acted) core.warning(`Unrecognised command: ${unknown}`);
