name: Triage bot

# Lets ANY commenter drive a ticket the way any logged-in user can in Trac.
# Commands are natural phrases on a line beginning with the handle.
#
# On an issue:
#   @triagebot-test accept
#   @triagebot-test ready for checkin
#   @triagebot-test needs design
#   @triagebot-test someday
#   @triagebot-test unreview
#       -> set the Triage stage
#   @triagebot-test claim | unclaim
#       -> take / drop ownership (claim replaces any previous assignee)
#   @triagebot-test flag <name> | unflag <name>
#       -> add / remove a Flags value; <name> is a natural phrase, one of:
#          patch needs improvement, needs tests, needs documentation,
#          easy pickings, ui/ux
#
# On a pull request (so an author can act without leaving GitHub or needing
# write access), applied to the issue(s) the PR would close:
#   @triagebot-test ready for review
#       -> clears "patch needs improvement": the author signals they've
#          addressed the review, sending the ticket back to the review queue.
#   @triagebot-test flag/unflag <name>
#
# No org membership needed; GitHub records the comment author immutably, so
# every change is auditable and reversible.
#
# Safety: the untrusted comment body is only read as a JavaScript variable
# inside actions/github-script; nothing is interpolated into a shell run: step.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const map = JSON.parse(
              fs.readFileSync('.github/issue-field-map.json', 'utf8')
            );
            const refresh = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/next-steps.js`);
            const HANDLE = '@triagebot-test';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const STAGE_PHRASES = {
              'accept': 'Accepted',
              'ready for checkin': 'Ready for checkin',
              'needs design': 'Design decision needed',
              'design decision needed': 'Design decision needed',
              'someday': 'Someday/Maybe',
              'someday maybe': 'Someday/Maybe',
              'unreview': 'Unreviewed',
            };
            const FLAG_PHRASES = {
              'patch needs improvement': 'Patch needs improvement',
              'needs tests': 'Needs tests',
              'needs documentation': 'Needs documentation',
              'needs docs': 'Needs documentation',
              'easy pickings': 'Easy pickings',
              'easy': 'Easy pickings',
              'ui/ux': 'UI/UX',
              'ui ux': 'UI/UX',
            };

            const comment = context.payload.comment;
            const isPR = !!context.payload.issue.pull_request;
            const react = (content) =>
              github.rest.reactions.createForIssueComment(
                { ...repo, comment_id: comment.id, content });

            // Parse each command line into an intent.
            const cmds = [];
            for (const raw of (comment.body || '').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line.toLowerCase().startsWith(HANDLE)) continue;
              const p = line.slice(HANDLE.length).trim().toLowerCase().replace(/\s+/g, ' ');
              if (p in STAGE_PHRASES) cmds.push({ kind: 'stage', value: STAGE_PHRASES[p] });
              else if (p === 'claim' || p === 'unclaim') cmds.push({ kind: p });
              else if (p === 'ready for review')
                cmds.push({ kind: 'unflag', value: 'Patch needs improvement' });
              else if (p.startsWith('unflag ') && FLAG_PHRASES[p.slice(7)])
                cmds.push({ kind: 'unflag', value: FLAG_PHRASES[p.slice(7)] });
              else if (p.startsWith('flag ') && FLAG_PHRASES[p.slice(5)])
                cmds.push({ kind: 'flag', value: FLAG_PHRASES[p.slice(5)] });
              else cmds.push({ kind: 'unknown' });
            }
            if (!cmds.length) return;

            // Resolve which issues to act on: the issue itself, or (for a PR
            // comment) the issues the PR would close.
            let targets;
            if (isPR) {
              const data = await github.graphql(
                `query($owner:String!,$repo:String!,$pr:Int!){
                   repository(owner:$owner,name:$repo){pullRequest(number:$pr){
                     closingIssuesReferences(first:20){nodes{number id}}}}}`,
                { owner: repo.owner, repo: repo.repo, pr: context.payload.issue.number });
              targets = data.repository.pullRequest.closingIssuesReferences.nodes
                .map((n) => ({ number: n.number, node_id: n.id }));
            } else {
              targets = [{ number: context.payload.issue.number,
                           node_id: context.payload.issue.node_id }];
            }
            if (!targets.length) { await react('confused'); return; }

            const flagsField = map['Flags'];
            async function currentFlagIds(number) {
              const d = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!){
                   repository(owner:$owner,name:$repo){issue(number:$number){
                     issueFieldValues(first:20){nodes{
                       ... on IssueFieldMultiSelectValue{
                         field{... on IssueFieldCommon{name}} options{id} }
                     }}}}}`,
                { owner: repo.owner, repo: repo.repo, number });
              for (const n of d.repository.issue.issueFieldValues.nodes)
                if (n.field && n.field.name === 'Flags')
                  return new Set(n.options.map((o) => o.id));
              return new Set();
            }
            async function writeFlags(nodeId, ids) {
              // An empty multiSelectOptionIds is rejected; clearing all options
              // requires delete: true instead.
              const field = ids.size
                ? { fieldId: flagsField.id, multiSelectOptionIds: [...ids] }
                : { fieldId: flagsField.id, delete: true };
              await github.graphql(
                `mutation($issue:ID!,$fields:[IssueFieldCreateOrUpdateInput!]!){
                   setIssueFieldValue(input:{issueId:$issue,issueFields:$fields}){
                     clientMutationId }}`,
                { issue: nodeId, fields: [field] });
            }
            async function setStage(nodeId, stage) {
              const f = map['Triage stage'];
              await github.graphql(
                `mutation($issue:ID!,$fields:[IssueFieldCreateOrUpdateInput!]!){
                   setIssueFieldValue(input:{issueId:$issue,issueFields:$fields}){
                     clientMutationId }}`,
                { issue: nodeId,
                  fields: [{ fieldId: f.id, singleSelectOptionId: f.options[stage] }] });
            }

            let acted = false;
            for (const cmd of cmds) {
              if (cmd.kind === 'stage') {
                if (isPR) continue;
                await setStage(targets[0].node_id, cmd.value);
                acted = true;
              } else if (cmd.kind === 'claim' || cmd.kind === 'unclaim') {
                if (isPR) continue;
                const actor = comment.user.login;
                if (cmd.kind === 'claim')
                  await github.rest.issues.update(
                    { ...repo, issue_number: targets[0].number, assignees: [actor] });
                else
                  await github.rest.issues.removeAssignees(
                    { ...repo, issue_number: targets[0].number, assignees: [actor] });
                acted = true;
              } else if (cmd.kind === 'flag' || cmd.kind === 'unflag') {
                const optionId = flagsField.options[cmd.value];
                for (const t of targets) {
                  const ids = await currentFlagIds(t.number);
                  if (cmd.kind === 'flag') ids.add(optionId); else ids.delete(optionId);
                  await writeFlags(t.node_id, ids);
                }
                acted = true;
              }
            }

            if (acted) for (const t of targets) await refresh({ github, context, number: t.number });
            await react(acted ? '+1' : 'confused');
