name: Next steps guidance

# Mirrors Trac's per-stage guidance box. Fires when a human changes an issue's
# fields in the web UI (field_added / field_removed). Bot- and Action-driven
# field changes use GITHUB_TOKEN and don't cascade into new workflow runs, so
# those paths call the same shared script (.github/scripts/next-steps.js)
# directly from triage-bot.yml and apply-issue-form.yml.
#
# Safety: issue content is only read via the API into JS variables; nothing is
# interpolated into a shell run: step.

on:
  issues:
    types: [opened, field_added, field_removed]

permissions:
  issues: write
  contents: read

concurrency:
  group: next-steps-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guidance:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/next-steps.js`);
            await run({ github, context });
