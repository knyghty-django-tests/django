name: Next steps guidance

# Mirrors Trac's per-stage guidance box. Whenever an issue's fields change
# (field_added / field_removed fire for any field, however the change is made
# — the triage bot, the web UI, or the form Action), this recomputes the
# "next steps" text from the current Triage stage (+ flags, for Accepted) and
# keeps it in a single sticky comment, editing in place so there's no noise.
#
# All guidance text is quoted from Django's own triaging-tickets documentation.
#
# Safety: issue content is only read via the API into JS variables; nothing is
# interpolated into a shell run: step.

on:
  issues:
    types: [opened, field_added, field_removed]

permissions:
  issues: write
  contents: read

concurrency:
  group: next-steps-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guidance:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- triage-next-steps -->';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const number = context.payload.issue.number;

            // Read the current Triage stage and Flags for this issue.
            const data = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){
                 repository(owner:$owner,name:$repo){
                   issue(number:$number){
                     issueFieldValues(first:20){nodes{
                       ... on IssueFieldSingleSelectValue{
                         field{... on IssueFieldCommon{name}} value }
                       ... on IssueFieldMultiSelectValue{
                         field{... on IssueFieldCommon{name}} options{name} }
                     }}
                   }
                 }
               }`,
              { owner: repo.owner, repo: repo.repo, number }
            );
            let stage = null;
            const flags = new Set();
            for (const n of data.repository.issue.issueFieldValues.nodes) {
              if (!n.field) continue;
              if (n.field.name === 'Triage stage') stage = n.value;
              if (n.field.name === 'Flags') for (const o of n.options) flags.add(o.name);
            }
            if (!stage) return; // nothing to guide on yet

            // Guidance text, quoted from Django's triaging-tickets documentation.
            let body;
            if (stage === 'Unreviewed') {
              body = "**Unreviewed** — The ticket has not been reviewed by anyone " +
                "who felt qualified to make a judgment about whether the ticket " +
                "contained a valid issue or ought to be closed. Unless you are both " +
                "the author of the ticket and intending to submit a patch, " +
                "unreviewed tickets should not be claimed.";
            } else if (stage === 'Accepted') {
              const needsWork = flags.has('Needs tests') ||
                flags.has('Needs documentation') || flags.has('Patch needs improvement');
              if (!flags.has('Has patch')) {
                body = "**Accepted · Needs patch** — The ticket is valid, but no one " +
                  "has submitted a patch for it yet. Often this means you could " +
                  "safely start writing a fix for it.";
              } else if (needsWork) {
                body = "**Accepted · Waiting on author** — The ticket has been " +
                  "reviewed, and has been found to need further work. \"Needs tests\" " +
                  "and \"Needs documentation\" are self-explanatory. \"Patch needs " +
                  "improvement\" will generally be accompanied by a comment on the " +
                  "ticket explaining what is needed to improve the code.";
              } else {
                body = "**Accepted · Needs review** — The ticket is waiting for " +
                  "people to review the supplied solution. This means downloading the " +
                  "patch and trying it out, verifying that it contains tests and docs, " +
                  "running the test suite with the included patch, and leaving " +
                  "feedback on the ticket.";
              }
            } else if (stage === 'Ready for checkin') {
              body = "**Ready for checkin** — The ticket was reviewed by a member of " +
                "the community other than the person who supplied the patch and found " +
                "to meet all the requirements for a commit-ready contribution. A " +
                "merger now needs to give a final review. There are a lot of pull " +
                "requests. It can take a while for your patch to get reviewed.";
            } else if (stage === 'Design decision needed') {
              body = "**Design decision needed** — This stage is for issues which may " +
                "be contentious, may be backwards incompatible, or otherwise involve " +
                "high-level design decisions. These issues should be discussed either " +
                "in the ticket comments or on django-developers. Decisions are " +
                "generally eventually made by the core committers.";
            } else if (stage === 'Someday/Maybe') {
              body = "**Someday/Maybe** — Used sparingly to keep track of long-term " +
                "changes. These tickets are uncommon and overall less useful since " +
                "they don't describe concrete actionable issues.";
            } else {
              return;
            }
            const newComment = `${MARKER}\n${body}`;

            // Find our existing sticky comment (search all pages).
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...repo, issue_number: number, per_page: 100 }
            );
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(MARKER)
            );

            if (existing) {
              if (existing.body.trim() !== newComment.trim()) {
                await github.rest.issues.updateComment(
                  { ...repo, comment_id: existing.id, body: newComment });
              }
            } else {
              await github.rest.issues.createComment(
                { ...repo, issue_number: number, body: newComment });
            }
