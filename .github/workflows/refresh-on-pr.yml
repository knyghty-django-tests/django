name: Refresh guidance on PR link

# "Has patch" is now derived from a linked pull request (not a manual flag), and
# linking a PR is a pull_request event, not an issue field change — so the
# next-steps guidance wouldn't otherwise refresh when a fixing PR is opened or
# closed. This resolves the issues a PR closes and re-runs the shared guidance
# script for each, so an Accepted ticket moves Needs patch -> Needs review as
# soon as its PR appears (and back if the PR is closed).
#
# Safety: only issue numbers (integers) are passed to the shared script; no
# PR-supplied text reaches a shell run: step.

on:
  pull_request:
    types: [opened, closed, reopened, edited, ready_for_review]

permissions:
  issues: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const prNumber = context.payload.pull_request.number;

            // Which issues would this PR close?
            const data = await github.graphql(
              `query($owner:String!,$repo:String!,$pr:Int!){
                 repository(owner:$owner,name:$repo){
                   pullRequest(number:$pr){
                     closingIssuesReferences(first:20){nodes{number}}
                   }
                 }
               }`,
              { owner: repo.owner, repo: repo.repo, pr: prNumber }
            );
            const numbers =
              data.repository.pullRequest.closingIssuesReferences.nodes.map((n) => n.number);
            if (!numbers.length) return;

            const refresh = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/next-steps.js`);
            for (const number of numbers) {
              await refresh({ github, context, number });
            }
