name: Cleanup/optimization
description: Refactoring, optimisation or polish
type: "Cleanup/optimization"
body:
  - type: markdown
    attributes:
      value: |
        **This is a migration demo, not Django's real tracker** — real tickets go to
        [code.djangoproject.com](https://code.djangoproject.com/newticket).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "CSRF"
        - "Core (Cache system)"
        - "Core (Mail)"
        - "Core (Management commands)"
        - "Core (Other)"
        - "Core (Serialization)"
        - "Core (System checks)"
        - "Core (URLs)"
        - "Database layer (models, ORM)"
        - "Documentation"
        - "Error reporting"
        - "File uploads/storage"
        - "Forms"
        - "GIS"
        - "Generic views"
        - "HTTP handling"
        - "Internationalization"
        - "Migrations"
        - "Packaging"
        - "Tasks"
        - "Template system"
        - "Testing framework"
        - "Uncategorized"
        - "Utilities"
        - "contrib.admin"
        - "contrib.admindocs"
        - "contrib.auth"
        - "contrib.contenttypes"
        - "contrib.flatpages"
        - "contrib.humanize"
        - "contrib.messages"
        - "contrib.postgres"
        - "contrib.sessions"
        - "contrib.sitemaps"
        - "contrib.sites"
        - "contrib.staticfiles"
        - "contrib.syndication"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: The Django version where you observed this.
      options:
        - "3.0"
        - "3.2"
        - "4.1"
        - "4.2"
        - "5.0"
        - "5.1"
        - "5.2"
        - "6.0"
        - "6.1"
        - "dev"
  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: Comma-separated tags, e.g. "orm, async".
  - type: checkboxes
    id: flags
    attributes:
      label: Flags
      options:
        - label: I have a patch (I'll open a pull request)
        - label: This concerns UI/UX
